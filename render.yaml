# Render.com deployment blueprint for Business OS
# https://render.com/docs/blueprint-spec

databases:
  - name: business-os-db
    databaseName: business_os
    user: business_os_user
    plan: free
    postgresMajorVersion: "16"

services:
  # ===== Backend (Django + Channels/Daphne) =====
  - type: web
    name: business-os-api
    runtime: python
    plan: free
    region: frankfurt
    rootDir: backend
    pythonVersion: "3.12"
    buildCommand: "pip install -r requirements.txt"
    startCommand: "sh -c \"python manage.py migrate --noinput && python manage.py collectstatic --noinput && daphne -b 0.0.0.0 -p $PORT config.asgi:application\""
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: business-os-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: REDIS_URL
        value: ""
      - key: CORS_ALLOWED_ORIGINS
        value: "https://business-os-web.onrender.com"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false

  # ===== Frontend (React + Vite static build) =====
  - type: web
    name: business-os-web
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: "./dist"
    envVars:
      - key: VITE_API_URL
        value: "https://business-os-api.onrender.com/api"
