<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reset Your Password</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f3f4f6; margin: 0; padding: 0; }
        .container { max-width: 500px; margin: 40px auto; background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .header { background: #2563eb; color: #fff; padding: 30px; text-align: center; }
        .header h1 { margin: 0; font-size: 22px; }
        .content { padding: 30px; }
        .content p { margin: 10px 0; color: #555; line-height: 1.6; }
        .btn { display: inline-block; background: #2563eb; color: #fff; text-decoration: none; padding: 12px 30px; border-radius: 8px; font-weight: bold; margin: 20px 0; }
        .footer { padding: 20px 30px; background: #f9fafb; text-align: center; color: #999; font-size: 12px; border-top: 1px solid #e5e7eb; }
        .code { font-size: 32px; font-weight: bold; color: #2563eb; letter-spacing: 8px; text-align: center; padding: 15px; background: #eff6ff; border-radius: 8px; margin: 15px 0; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Business OS</h1>
        </div>
        <div class="content">
            <p>Hello {{ user.first_name|default:user.email }},</p>
            <p>We received a request to reset your password. Use the code below:</p>
            <div class="code">{{ reset_code }}</div>
            <p>This code will expire in 30 minutes.</p>
            <p>If you didn't request a password reset, please ignore this email.</p>
        </div>
        <div class="footer">
            <p>&copy; {{ year }} Business OS. All rights reserved.</p>
        </div>
    </div>
</body>
</html>
